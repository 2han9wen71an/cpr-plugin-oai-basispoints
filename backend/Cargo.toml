[package]
name = "cpr-plugin-oai-basispoints"
version = "0.2.14"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[[test]]
name = "protocol"
path = "tests/protocol.rs"

[[test]]
name = "middleware_wire"
path = "tests/middleware_wire.rs"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "3cc6cc9e2f8769f62c2267d11ebc036c75ebd1ad", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha1 = "0.10.6"
sha2 = "0.10.9"
tokio = { version = "1.52.3", default-features = false, features = ["io-std", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = ["io-util"] }

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = 10 }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 1
panic = "abort"
